#
# Closed-loop policy for one offline wrapper-inclusive inspection build. This
# additive policy binds the accepted wrapper namespace probe, exact 20-artifact
# staging and audit, pinned JNI source contract, and a non-release receipt.

schemaVersion = 1
kind = "ziv-native-wrapper-build-executor-policy-v1"

[binding]
profileName = "ziv-libmpv-stack-wrapper-api26-v1"
profileSha256 = "d6cf2a360b4c8f159e49fc9a9872faf4a21e3dc5e8a225905d3b3ccaf4fe42ce"
namespaceProbePolicyPath = "native/native-wrapper-executor-policy.toml"
namespaceProbePolicySha256 = "e38767eb0e8e095364d13040a9ce3f49479f9147e1a2740d4f81860c496d1647"
namespaceProbeTranscriptSha256 = "e182d70ac1a76b00f7f3a622835c23621ba3df4654a339b945f66094f959dc9f"
preparationReceiptKind = "ziv-native-build-preparation-wrapper-v1"
preparationReceiptSha256 = "e51dae00b7f145de9663ee1b90010bf9904f8775ff2f12624454040c941132b4"
toolchainCompositionReceiptSha256 = "e9b88860b8e6d043a80a7f3d6aa7e3e641574e7da4c66a0541db129a4e081989"
hostPlatform = "linux/amd64"
toolchainMount = "/opt/zivplayer/toolchain"
sourceMount = "/build/source"
outputMount = "/build/output"
homeMount = "/build/home"
temporaryMount = "/build/tmp"
wrapperInputMount = "/build/wrapper"
wrapperInputReadOnly = true

[gate]
phase = "offline-wrapper-inspection-build"
buildCommands = true
artifactStaging = true
artifactAudit = true
buildReceipt = true
ready = false
releaseInput = false

[execution]
environmentMode = "empty"
commandsSource = "native-wrapper-build-profile"
commandOrder = "sequential-exact"
namespaceProfile = "ziv-native-wrapper-build-namespace-execution-v1"
namespaceArgumentCount = 31
preservedDescriptorCount = 11
seccompInvocation = ["/usr/bin/perl", "/usr/share/zivplayer/toolchain-evidence/apt-stage/helpers/native/toolchain/install-seccomp.pl"]
runnerInterpreterInvocation = ["/bin/bash", "--noprofile", "--norc"]
runnerInvocation = ["/run/ziv-native-wrapper-build-runner.bash", "--execute-locked-wrapper-build"]
procHidepidRequested = "2"
procHidepidAccepted = ["2", "invisible"]
workspaceReuse = "single-attempt"
buildTimeoutSeconds = 14400
timeoutValidation = "dedicated-build-wall-clock-deadline"
stdoutLimitBytes = 33554432
stderrLimitBytes = 33554432
stderrAllowed = true
commandEventSource = "locked-runner-bytes-plus-parent-launch-and-exit"
childStdoutMarkers = "diagnostic-only-non-authoritative"
transcript = "bounded-stream-sha256-plus-parent-runner-events"
parentDeathSignal = "SIGKILL"
newSession = true
failureTeardown = "pidfd-sigterm-2s-cgroup-kill-pidfd-sigkill"
leaderSigtermGraceSeconds = 2
cgroupDrainTimeoutSeconds = 10
cgroupRemoval = "require-empty-and-identity"
failureRetention = "retain-workspace-and-attempt"
rlimitNoFile = 4096
rlimitFileSizeBytes = 2147483648
rlimitCoreBytes = 0

[cgroup]
version = 2
controllers = ["cpu", "io", "memory", "pids"]
pidsMax = 512
memoryMaxBytes = 2147483648
memorySwapMaxBytes = 0
cpuQuotaMicros = 200000
cpuPeriodMicros = 100000
ioReadBytesPerSecond = 8388608
ioWriteBytesPerSecond = 8388608
ioReadOperationsPerSecond = 2048
ioWriteOperationsPerSecond = 2048
ioDevicePolicy = "require-apt-sdk-canonical-source-and-workspace-same-block-device"

[filesystem]
minimumFreeBytes = 8589934592
reserveFreeBytes = 4294967296
minimumFreeInodes = 250000
reserveFreeInodes = 100000
maximumEntryDelta = 104096
maximumLibraryBytes = 536870912
maximumArtifactBytes = 4294967296

[workspace]
precondition = "verified-preparation"
attemptMarkerName = "ziv-native-wrapper-build-attempt.json"
attemptMarkerKind = "ziv-native-wrapper-build-attempt-v1"
attemptMarkerSchemaVersion = 1
attemptMarkerCanonicalJson = true
attemptMarkerMode = 384
attemptMarkerOwnerUid = 0
attemptMarkerOwnerGid = 0
attemptMarkerLinkCount = 1
attemptMarkerNormalizedMtimeNs = 946684800000000000
attemptMarkerXattrs = "forbidden"
attemptMarkerMaximumBytes = 65536
attemptMarkerPublication = "workspace-root-create-no-replace-fsync"
attemptMarkerPublicationParent = "pinned-workspace-descriptor"
attemptMarkerReadback = "stable-canonical-bytes-and-sha256"
attemptMarkerParentFsync = true
attemptMarkerRecords = [
    "policy-sha256",
    "profile-name-and-sha256",
    "preparation-and-composition-receipt-sha256",
    "accepted-namespace-probe-policy-and-transcript-sha256",
    "executor-helper-sha256",
    "exact-command-order",
    "attempt-state-consumed-before-launch",
]
attemptMarkerFields = [
    "artifactAudited",
    "artifactStaged",
    "buildExecuted",
    "commands",
    "kind",
    "launcherSha256",
    "namespaceProbePolicySha256",
    "namespaceProbeTranscriptSha256",
    "namespaceSha256",
    "policySha256",
    "preparationReceiptSha256",
    "profileName",
    "profileSha256",
    "ready",
    "releaseInput",
    "runnerSha256",
    "schemaVersion",
    "seccompSha256",
    "state",
    "toolchainCompositionReceiptSha256",
]
attemptMarkerFieldOrder = "canonical-json-lexicographic"
attemptMarkerAdditionalFields = "forbidden"
attemptMarkerState = "consumed-before-launch"
attemptMarkerBuildExecuted = false
attemptMarkerArtifactStaged = false
attemptMarkerArtifactAudited = false
attemptMarkerReady = false
attemptMarkerReleaseInput = false
preparationReceiptDisposition = "retain-read-only"
mutableAfterAttempt = ["source", "output", "home", "tmp"]
canonicalSourcePostcondition = "reverify-external-canonical-source-input-unchanged"
preparedSourcePostcondition = "allow-build-mutations-within-pinned-directory-and-bounded-filesystem-delta"
immutableInputsPostcondition = "reverify-policy-profile-receipts-toolchain-helpers-wrapper-bytes-and-identity"
failureDisposition = "retain-workspace-and-attempt-without-build-receipt"

[artifacts]
stagingMode = "copy-exact-allowlist"
publication = "per-abi-tree-no-replace-fsync"
builtLibraryRootTemplate = "/build/source/buildscripts/prefix/{upstreamArch}/lib"
runtimeLibraryRootTemplate = "/opt/zivplayer/toolchain/android-sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/{ndkRuntimeDirectory}"
outputLibraryTemplate = "/build/output/{abi}/{library}"
expectedLibraries = [
    "libavcodec.so",
    "libavdevice.so",
    "libavfilter.so",
    "libavformat.so",
    "libavutil.so",
    "libc++_shared.so",
    "libmpv.so",
    "libswresample.so",
    "libswscale.so",
    "libzivplayer_mpv.so",
]
builtLibraries = [
    "libavcodec.so",
    "libavdevice.so",
    "libavfilter.so",
    "libavformat.so",
    "libavutil.so",
    "libmpv.so",
    "libswresample.so",
    "libswscale.so",
    "libzivplayer_mpv.so",
]
runtimeLibraries = ["libc++_shared.so"]
abiDirectoryMode = 493
libraryMode = 420
normalizedMtimeNs = 946684800000000000
sourceSymlinkPolicy = "resolve-within-locked-root-copy-regular-bytes"
outputSymlinks = "forbidden"
outputHardlinks = "forbidden"
outputXattrs = "forbidden"

[audit]
elfToolPath = "/opt/zivplayer/toolchain/android-sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
elfToolTarget = "llvm-readobj"
elfToolTargetSha256 = "5104576a3518575cf1887c2afa9249bbd0dc175cb9dc0f2af0d430fe0cb20bbe"
elfToolDialect = "llvm-readelf"
elfToolArguments = [
    "--file-header",
    "--program-headers",
    "--dynamic-table",
    "--dyn-symbols",
    "--relocations",
    "--notes",
    "--wide",
]
dynamicSymbolTablePolicy = "require-one-complete-dynsym-table-with-contiguous-zero-based-indices"
symbolNamePolicy = "preserve-version-and-reject-whitespace-except-readelf-version-index"
dynamicNamePolicy = "require-whitespace-free-bracket-free-soname-and-needed-with-no-trailing-data"
elfType = "ET_DYN"
pageSizeBytes = 16384
loadSegmentPolicy = "require-one-or-more-load-segments-each-align-16384-and-offset-vaddr-congruent"
sonamePolicy = "require-one-basename-per-artifact-and-unique-within-abi"
neededPolicy = "require-basename-and-resolve-to-staged-soname-or-api26-platform-stub"
dependencyClosurePolicy = "per-abi-complete-no-unknown-needed"
jniExportPolicy = "require-wrapper-exact-jni-lifecycle-and-no-other-jni-or-java-prefix"
nativeApiEvidence = "locked-api26-driver-plus-built-ident-api26-ndk-r29-and-api26-version-aware-symbol-closure"
platformStubRootTemplate = "/opt/zivplayer/toolchain/android-sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/{ndkRuntimeDirectory}/26"
platformSonameAllowlist = [
    "libOpenSLES.so",
    "libaaudio.so",
    "libandroid.so",
    "libc.so",
    "libdl.so",
    "libEGL.so",
    "libGLESv2.so",
    "libGLESv3.so",
    "libjnigraphics.so",
    "liblog.so",
    "libm.so",
    "libmediandk.so",
    "libvulkan.so",
    "libz.so",
]
platformSymbolPolicy = "resolve-each-strong-undefined-platform-symbol-at-api26"
symbolVersionPolicy = "resolve-exact-version-or-default-version-alias"
unresolvedWeakSymbolPolicy = "allow-only-locked-abi-library-symbol-type-visibility-and-relocation-set"
allowedUnresolvedWeakSymbols = [
    { abi = "arm64-v8a", library = "libavcodec.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
    { abi = "arm64-v8a", library = "libavfilter.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
    { abi = "arm64-v8a", library = "libavformat.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
    { abi = "arm64-v8a", library = "libavutil.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
    { abi = "arm64-v8a", library = "libmpv.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
    { abi = "arm64-v8a", library = "libswscale.so", symbol = "memfd_create", symbolTypes = ["NOTYPE"], symbolVisibilities = ["DEFAULT"], relocationTypes = ["R_AARCH64_GLOB_DAT"] },
]
androidIdentNotePolicy = "require-built-artifact-api26-and-ndk-r29-record-locked-runtime"

[[audit.abi]]
name = "arm64-v8a"
clangTriple = "aarch64-linux-android26"
elfClass = 64
elfMachine = "AArch64"

[[audit.abi]]
name = "x86_64"
