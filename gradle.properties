# Leave room for JVM metadata and native memory within an approximately 2 GiB build budget.
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon.idletimeout=600000
org.gradle.warning.mode=all
org.gradle.java.installations.auto-download=false
org.gradle.dependency.verification.console=verbose

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.builtInKotlin=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
